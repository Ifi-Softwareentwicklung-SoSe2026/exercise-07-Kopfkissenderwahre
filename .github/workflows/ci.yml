name: CI Pipeline

# This workflow is intentionally incomplete. Read it, change it, and extend it.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore csharp/TruthTable.slnx

      - name: Build project
        run: dotnet build csharp/TruthTable.slnx --no-restore --configuration Release -warnaserror # warnaserror: Treat warnings as errors

      - name: Run tests
        run: dotnet test csharp/TruthTable.slnx --no-build --configuration Release --logger "trx;LogFileName=test_results.trx" --results-directory ./TestResults

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
